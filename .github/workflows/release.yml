name: Desktop apps

# Builds the native NEXUS desktop app for Windows, macOS and Linux, packages
# each one as a real installer, and - when a version tag is pushed (or this
# workflow is dispatched with a tag) - publishes them as GitHub Release assets:
#
#   NEXUS-windows-x64-setup.exe   Inno Setup installer (Start Menu entry,
#                                 optional desktop shortcut, uninstaller in
#                                 Add/Remove Programs)
#   NEXUS-macos.dmg               disk image with a drag-to-Applications window
#   NEXUS-linux-x64.deb           apt-installable; adds a launcher entry + icon
#   NEXUS-linux-x64.tar.gz        portable build for non-Debian distros
#
# The Release is what makes the README's download buttons work: GitHub serves
# the newest non-prerelease at a permanent URL, so
#   https://github.com/<owner>/<repo>/releases/latest/download/NEXUS-windows-x64-setup.exe
# always points at the current build. Actions artifacts can't do that - they
# require a GitHub login and expire - so they're only used here to hand the
# built app from each platform job to the release job.
#
# Cutting a release:
#   git tag v0.1.0 && git push origin v0.1.0
# or run this workflow manually and fill in the `tag` input.

on:
  push:
    branches:
      - main
      - 'cursor/**'
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish a Release as (e.g. v0.1.0). Leave blank to just build.'
        required: false
        default: ''

permissions:
  contents: read

# Three desktop runners per push is expensive, and a superseded branch build
# is worthless - so a newer push on the same ref cancels the older run. Tag
# runs are exempt: those publish a Release and must always finish.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Must be a Flutter whose `flutter build windows` knows the Visual Studio
  # 2026 (major 18) CMake generator - windows-latest is now the
  # windows-2025-vs2026 image, and older Flutter falls back to asking for
  # "Visual Studio 16 2019", which isn't installed there.
  FLUTTER_VERSION: '3.44.8'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4

      # A branch build has no tag, so it just gets 0.0.0 - it never ships.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          tag='${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}'
          [ -n "$tag" ] || tag='v0.0.0'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # GTK for the shell, libmpv/epoxy for media_kit's video player, and
      # libsecret for flutter_secure_storage's Linux keyring backend.
      # dpkg-dev gives us dpkg-shlibdeps for the .deb's Depends line.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config liblzma-dev dpkg-dev \
            libgtk-3-dev libmpv-dev libepoxy-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install shared package dependencies
        run: dart pub get
        working-directory: shared

      - name: Install app dependencies
        run: flutter pub get
        working-directory: app

      # NEXUS_VERSION is what the in-app update check compares against the
      # newest GitHub release; a build without it stays on the dev sentinel
      # and never offers updates.
      - name: Build ${{ matrix.platform }} (release)
        run: >
          flutter build ${{ matrix.platform }} --release
          --build-name=${{ steps.ver.outputs.version }}
          --dart-define=NEXUS_VERSION=${{ steps.ver.outputs.version }}
        working-directory: app

      # Inno Setup ships on the windows runner images, but install it if the
      # image ever drops it rather than failing the release.
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not present; installing via Chocolatey."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} `
                  app\windows\installer\nexus.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      # A .dmg whose window has the app next to an /Applications symlink is the
      # install gesture Mac users expect. hdiutil is part of macOS.
      - name: Build macOS disk image
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist staging
          app_path="$(find app/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app_path" ]; then echo "No .app bundle was produced"; exit 1; fi
          echo "Packaging $app_path"
          cp -R "$app_path" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname NEXUS -srcfolder staging \
            -ov -format UDZO dist/NEXUS-macos.dmg

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          # Ship the tarball as a NEXUS/ directory rather than loose files, so
          # extracting doesn't scatter a bundle across the user's cwd.
          mv app/build/linux/x64/release/bundle app/build/linux/x64/release/NEXUS
          tar -czf dist/NEXUS-linux-x64.tar.gz -C app/build/linux/x64/release NEXUS
          packaging/linux/build-deb.sh \
            app/build/linux/x64/release/NEXUS \
            '${{ steps.ver.outputs.version }}' \
            dist/NEXUS-linux-x64.deb

      - name: Upload ${{ matrix.platform }} package
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish for an explicit version - ordinary branch pushes just build.
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect built apps
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          ls -lh dist
          # Re-runnable: replace the assets if the tag already has a Release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "NEXUS $TAG" \
              --generate-notes
          fi
